<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tube Downloader</title>

        <!-- font awesome -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

        <!-- custom css -->
        <link rel="stylesheet" href="assets/style.css"/>
    </head>

    <body>
        <div class="container">
            <h1><i class="fa-solid fa-cloud-arrow-down" style="color: #ff9238;"></i> Tube Downloader</h1>
            <form id="downloadForm">
                <input id="urlInput" type="text" name="url" placeholder="Paste YouTube link here" required autocomplete="off">
                <div class="meta" id="metaSection">
                    <img id="thumbImg" class="thumb" src="" alt="thumbnail">
                    <div class="meta-info">
                        <div class="title" id="videoTitle"></div>
                        <div class="quality-row">
                            <select id="qualitySelect" name="quality" required>
                                <!-- options populated dynamically -->
                            </select>
                        </div>
                    </div>
                </div>
                <button id="downloadBtn" type="submit"><i class="fa-solid fa-download  fa-beat"></i> Download</button>
            </form>
            <div class="loader" id="loader"></div>
            <div class="small-note" id="note"></div>
        </div>

        <!-- jQuery CDN -->
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="assets/script.js"></script>
    </body>
</html>
