<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Tube Downloader</title>
        <style>
            body {
                font-family: 'Segoe UI', Arial, sans-serif;
                background: linear-gradient(135deg, #FDB5CE, #FAB95B); 
                margin: 0;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .container {
                background: #fff;
                padding: 40px;
                border-radius: 12px;
                box-shadow: 0 8px 20px rgba(0,0,0,0.2);
                text-align: center;
                width: 400px;
                max-width: 90%;
            }

            h1 {
                margin-bottom: 20px;
                color: #333;
            }

            input[type=text] {
                width: 100%;
                padding: 12px;
                border: 2px solid #ddd;
                border-radius: 8px;
                font-size: 16px;
                margin-bottom: 20px;
                transition: border-color 0.3s;
            }

            input[type=text]:focus {
                border-color: #4facfe;
                outline: none;
            }

            button {
                background: #ff901c;
                color: #fff;
                border: none;
                padding: 12px 24px;
                border-radius: 8px;
                font-size: 16px;
                cursor: pointer;
                transition: background 0.3s, transform 0.2s;
            }

            button:hover {
                background: #cb7215;
                transform: translateY(-2px);
            }

            /* Loader spinner */
            .loader {
                display: none;
                border: 6px solid #f3f3f3;
                border-top: 6px solid #4facfe;
                border-radius: 50%;
                width: 40px;
                height: 40px;
                animation: spin 1s linear infinite;
                margin: 20px auto 0;
            }

            @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
            }
        </style>
    </head>

    <body>
        <div class="container">
            <h1>Tube Downloader</h1>
            <form id="downloadForm">
                <input type="text" name="url" placeholder="Paste YouTube link here" required>
                <button type="submit">Download</button>
            </form>
            <div class="loader" id="loader"></div>
        </div>

        <!-- jQuery CDN -->
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script>
            $(function(){
                $("#downloadForm").on("submit", function(e){
                    e.preventDefault();
                    $("#loader").show();

                    $.ajax({
                        url: "/download",
                        type: "POST",
                        data: $(this).serialize(),
                        xhrFields: {
                            responseType: 'blob' // expect binary file
                        },
                        success: function(data, status, xhr){
                            $("#loader").hide();

                            // trigger browser download with correct filename
                            const blob = new Blob([data], {type: "video/mp4"});
                            const link = document.createElement("a");
                            const url = window.URL.createObjectURL(blob);
                            link.href = url;

                            // get filename from header if available
                            const disposition = xhr.getResponseHeader("Content-Disposition");
                            let filename = "video.mp4";
                            if (disposition && disposition.indexOf("filename=") !== -1) {
                                filename = disposition.split("filename=")[1].replace(/"/g, "");
                            }
                            link.download = filename;

                            document.body.appendChild(link);
                            link.click();
                            document.body.removeChild(link);
                            window.URL.revokeObjectURL(url);
                        },
                        error: function(){
                            $("#loader").hide();
                            alert("Download failed!");
                        }
                    });
                });
            });
        </script>
    </body>
</html>
